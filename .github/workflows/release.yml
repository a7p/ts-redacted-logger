name: Release

# Publishes to npm when a GitHub release is published (tag e.g. v1.2.3).
# Uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed:
# configure it once at npmjs.com → package settings → Trusted publishing,
# pointing at this repository and the workflow file `release.yml`.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Publish
        run: npm publish --provenance --access public
