name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Run examples (ESM and CommonJS)
        run: node examples/basic.mjs && node examples/basic.cjs

  package:
    name: Package works for consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pack tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tar -tzf "$RUNNER_TEMP"/ts-redacted-logger-*.tgz
      - name: Install into a fresh project and use it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install ../ts-redacted-logger-*.tgz
          node --input-type=module -e "
            import { createLogger } from 'ts-redacted-logger';
            const out = createLogger(['hunter2']).redact('pw hunter2');
            if (out !== 'pw [REDACTED]') throw new Error('ESM: ' + out);
            console.log('ESM ok:', out);
          "
          node -e "
            const { createLogger } = require('ts-redacted-logger');
            const out = createLogger(['hunter2']).redact('pw hunter2');
            if (out !== 'pw [REDACTED]') throw new Error('CJS: ' + out);
            console.log('CJS ok:', out);
          "
          test -f node_modules/ts-redacted-logger/dist/index.d.ts
